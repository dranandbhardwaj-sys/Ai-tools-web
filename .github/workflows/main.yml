name: Deploy AI Creator Toolkit to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ai-creator-toolkit/**'
      - 'index.html'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web Folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-creator-toolkit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
